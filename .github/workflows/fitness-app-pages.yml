name: Deploy apps to GitHub Pages

on:
  push:
    branches:
      - claude/fitness-ai-tracking-app-efxn7m
      - master
    paths:
      - "fitness-app/**"
      - "element-simyasi/**"
      - ".github/workflows/fitness-app-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble site
        run: |
          mkdir -p _site/element-simyasi
          cp -r fitness-app/* _site/
          cp -r element-simyasi/* _site/element-simyasi/

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
